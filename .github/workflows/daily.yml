name: Daily update

on:
  schedule:
    - cron: "30 22 * * *"   # 05:30 Jakarta time, after US close and before Asia opens
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/build.py
      - name: Commit new data
        run: |
          git config user.name "dividend-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%Y-%m-%d)"
          git push
